[project]
name = "kam-agent"
version = "0.1.0"
description = "Virtual Key Account Manager voice agent for Snapdeal sellers"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.6.0",
    "livekit-plugins-noise-cancellation>=0.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

